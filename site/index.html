<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réflexes cyber</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <header class="bandeau">
      <div class="avatar" id="perso-avatar" aria-hidden="true"></div>
      <div>
        <h1 id="nom"></h1>
        <p id="slogan"></p>
      </div>
    </header>
    <p class="metier">
      <label for="metier">Mon métier :</label>
      <select id="metier"></select>
      <span class="source">Les modules marqués ★ sont prioritaires pour ton métier.</span>
    </p>
    <section class="jour" aria-labelledby="titre-jour">
      <h2 id="titre-jour">Ton module du jour</h2>
      <p id="jour-texte"></p>
      <a id="jour-lien" class="bouton plein" href="#">Commencer (2 minutes)</a>
      <p id="progression" class="source"></p>
    </section>
    <div id="rubriques"></div>
    <footer id="pied"></footer>
  </main>
  <script src="assets/accueil.js"></script>
</body>
</html>
