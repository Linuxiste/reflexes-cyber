# Réflexes cyber sur la VM Linuxiste : https://linuxiste.fr/reflexes/
# Installé dans /etc/apache2/conf-available/reflexes-cyber.conf (a2enconf reflexes-cyber ; a2enmod headers).
# Les versions vivent dans /var/www/reflexes-cyber/releases/<date> ; « current » pointe sur la version active.
# /reflexes sans barre finale : redirection directe en HTTPS (Apache est derrière Traefik, il ne voit que du HTTP)
RedirectMatch 301 ^/reflexes$ https://linuxiste.fr/reflexes/
Alias /reflexes/ /var/www/reflexes-cyber/current/

<Directory /var/www/reflexes-cyber/current>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</Directory>
