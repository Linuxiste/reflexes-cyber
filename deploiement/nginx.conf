# Réflexes cyber : site statique, aucune donnée collectée.
# Journal sans adresse IP : on compte les visites par page (bilan des campagnes) sans savoir qui a cliqué.
log_format anonyme '$time_iso8601 "$request_method $uri" $status';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log anonyme;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / { try_files $uri $uri/ =404; }
    location ~ \.sqlite$ { return 404; }
}
