# Usage : ORGANISATION=exemple docker compose up -d --build   → http://<adresse-de-la-vm>:8080/
services:
  site:
    build:
      context: .
      args:
        ORGANISATION: ${ORGANISATION:-exemple}
    image: reflexes-cyber:${ORGANISATION:-exemple}
    container_name: reflexes-cyber
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
